# Render Blueprint — deploy the FastAPI backend as a web service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-guardian-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./aiguardian.db
    plan: free
