<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="logoShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="logoRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="logoAiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Shield Emblem Group (scaled and translated) -->
  <g transform="translate(10, 8) scale(0.55)">
    <!-- Outer Shield -->
    <path d="M55 6 C78 6 94 14 94 36 C94 65 74 88 55 104 C36 88 16 65 16 36 C16 14 32 6 55 6 Z"
          fill="url(#logoShieldBg)"
          stroke="url(#logoRim)"
          stroke-width="3"
          stroke-linejoin="round" />
    <!-- Inner Inset -->
    <path d="M55 16 C70 16 82 22 82 38 C82 60 67 79 55 92 C43 79 28 60 28 38 C28 22 40 16 55 16 Z"
          fill="#0F172A"
          stroke="#38BDF8"
          stroke-width="1.5"
          stroke-dasharray="5 2.5" />
    <!-- Circuits -->
    <line x1="55" y1="20" x2="55" y2="36" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <circle cx="55" cy="20" r="2.5" fill="#93C5FD" />
    <path d="M38 32 L46 40" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <circle cx="38" cy="32" r="2" fill="#93C5FD" />
    <path d="M72 32 L64 40" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <circle cx="72" cy="32" r="2" fill="#93C5FD" />
    <line x1="55" y1="64" x2="55" y2="80" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <circle cx="55" cy="80" r="2.5" fill="#93C5FD" />
    <!-- Center Core -->
    <polygon points="55,36 68,50 55,64 42,50"
             fill="url(#logoAiCore)"
             stroke="#A7F3D0"
             stroke-width="1.8" />
    <circle cx="55" cy="50" r="4.5" fill="#FFFFFF" />
    <circle cx="55" cy="50" r="2" fill="#047857" />
  </g>

  <!-- Typography: AI GUARDIAN -->
  <text x="82" y="44"
        fill="#0F172A"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="1.5">
    AI GUARDIAN
  </text>

  <!-- Subtitle Tagline: CONTINUOUS CYBER RISK QUANTIFICATION -->
  <text x="83" y="62"
        fill="#64748B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="9.5"
        font-weight="600"
        letter-spacing="2.5">
    CYBER RISK QUANTIFICATION &amp; OPTIMIZATION
  </text>

  <!-- Security Verification Badge -->
  <rect x="360" y="27" width="50" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="385" y="41"
        fill="#334155"
        font-family="monospace"
        font-size="9"
        font-weight="700"
        text-anchor="middle">
    v1.0
  </text>
</svg>
